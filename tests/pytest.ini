[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
markers =
    unit: pure unit tests with no external deps
    integration: tests that require a running database
    slow: tests that take more than a few seconds
# Run with: backend/.venv/bin/python -m pytest tests/unit/ -v
# Integration tests additionally need: docker-compose up postgres redis
