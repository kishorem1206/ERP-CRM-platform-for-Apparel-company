version: "3.9"

# Production overrides — run with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# All secrets come from environment variables (set via CI/CD or a .env.prod file
# that is NEVER committed to git). See docs/deployment.md for the full checklist.

services:
  postgres:
    restart: always
    ports: []  # Not exposed externally — access via erp_network only
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    restart: always
    ports: []
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 384m

  backend:
    restart: always
    volumes: []  # No bind-mount in prod — code baked into image
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --loop uvloop --http httptools"
    environment:
      APP_ENV: production
      # All other secrets injected by CI/CD at deploy time — no hardcoded values here.
    deploy:
      resources:
        limits:
          memory: 1g
      update_config:
        order: start-first      # zero-downtime rolling update
        failure_action: rollback
      rollback_config:
        parallelism: 1

  celery_worker:
    restart: always
    volumes: []
    command: celery -A app.workers.celery_app worker --loglevel=warning --concurrency=4 --max-tasks-per-child=500
    deploy:
      resources:
        limits:
          memory: 512m

  celery_beat:
    restart: always
    volumes: []
    command: celery -A app.workers.celery_app beat --loglevel=warning --scheduler celery.beat:PersistentScheduler
    deploy:
      resources:
        limits:
          memory: 128m

  frontend:
    restart: always
    volumes: []
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 512m
      update_config:
        order: start-first
        failure_action: rollback

  nginx:
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro  # TLS certs (certbot-managed or pre-provisioned)
    deploy:
      resources:
        limits:
          memory: 64m
