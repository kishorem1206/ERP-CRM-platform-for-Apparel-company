version: "3.9"

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/seeds/001_permissions.sql:/docker-entrypoint-initdb.d/02_permissions.sql
      - ./db/seeds/002_hsn_codes.sql:/docker-entrypoint-initdb.d/03_hsn_codes.sql
      - ./db/seeds/003_master_data.sql:/docker-entrypoint-initdb.d/04_master_data.sql
      - ./db/seeds/004_products.sql:/docker-entrypoint-initdb.d/05_products.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── FastAPI Backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - APP_ENV=production
      # Override localhost URLs with Docker service names
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CRON_SECRET=${CRON_SECRET:-local-dev-cron-secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    # Schema is created by postgres initdb (schema.sql); seeds run via seed.py
    command: >
      sh -c "python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --timeout-graceful-shutdown 5"

  # ── Scheduled jobs ────────────────────────────────────────────────────────────
  # Stand-in for the production Cloudflare Worker Cron Trigger: calls the
  # backend's cron tick every 10 minutes; the backend decides which jobs are due.
  cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - CRON_SECRET=${CRON_SECRET:-local-dev-cron-secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 30
        while true; do
          curl -s -X POST -H "X-Cron-Secret: $$CRON_SECRET" http://backend:8000/api/v1/internal/cron/tick -o /dev/null -w "cron tick: %{http_code}\n"
          sleep 600
        done

  # ── Next.js Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_URL=http://backend:8000
    restart: unless-stopped
    env_file: .env
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

  # ── NGINX Reverse Proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: erp_network
